[project]
name = "waste-guide"
version = "1.0.0"
description = "Multimodal waste identification and rule-based disposal guidance"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162",
    "huggingface_hub>=1.0",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
